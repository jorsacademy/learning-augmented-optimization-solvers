name: Interpretable MIO

on:
  push:
    branches: [main]
    paths:
      - "projects/mixed-integer-interpretable-ml/**"
      - ".github/workflows/interpretable-mio.yml"
  pull_request:
    paths:
      - "projects/mixed-integer-interpretable-ml/**"
      - ".github/workflows/interpretable-mio.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: projects/mixed-integer-interpretable-ml

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Benchmark smoke
        run: python -m mio_scorecard.experiment
